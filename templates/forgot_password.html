{% extends "base.html" %}

{% block title %}Forgot Password - Disaster Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Forgot Password</h1>
    <p class="auth-info">Enter your registered email and we'll send you a link to reset your password.</p>
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <button type="submit">Send Reset Link</button>
    </form>
    <p class="auth-switch"><a href="/login">Back to Login</a></p>
</div>
{% endblock %}
