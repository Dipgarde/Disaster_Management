{% extends "base.html" %}

{% block title %}Register - Disaster Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Register</h1>

    {% if error %}
        <p class="auth-error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>

        <div class="password-wrapper">
            <input type="password" name="password" id="registerPassword" placeholder="Password" required>
            <span class="toggle-password" onclick="togglePassword('registerPassword', this)">👁️</span>
        </div>

        <button type="submit">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Login here</a></p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
